name: Publish skills to Notion

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Review, set up schema, or publish the current main revision
        type: choice
        options: [plan, schema-plan, schema-apply, publish]
        default: plan
      repair_skill:
        description: Optional reviewed skill to repair (plan or publish only)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: notion-skills-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'limelighthq/skills' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (vars.NOTION_SYNC_ENABLED == 'true' && vars.NOTION_BIDIRECTIONAL_ENABLED != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Run the requested publishing operation
        shell: bash
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REPAIR_SKILL: ${{ inputs.repair_skill }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          if [ "$TRIGGER_EVENT" != workflow_dispatch ]; then
            REQUESTED_MODE=publish
          fi
          repair_args=()
          if [ -n "$REPAIR_SKILL" ]; then
            if [[ ! "$REPAIR_SKILL" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ || ${#REPAIR_SKILL} -gt 64 ]]; then
              echo 'Repair must name one valid skill.' >&2
              exit 1
            fi
            if [[ "$REQUESTED_MODE" != plan && "$REQUESTED_MODE" != publish ]]; then
              echo 'Repair is supported only with plan or publish.' >&2
              exit 1
            fi
            repair_args=(--repair "$REPAIR_SKILL")
          fi
          case "$REQUESTED_MODE" in
            plan) npm run notion:plan -- "${repair_args[@]}" ;;
            schema-plan) npm run notion:schema ;;
            schema-apply) npm run notion:schema -- --apply ;;
            publish) npm run notion:publish -- --apply "${repair_args[@]}" ;;
            *) echo 'Unknown publishing mode.' >&2; exit 1 ;;
          esac
