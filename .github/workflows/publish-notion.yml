name: Publish skills to Notion

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Review a plan or publish the current main revision
        type: choice
        options: [plan, publish]
        default: plan

permissions:
  contents: read

concurrency:
  group: notion-skills-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'limelighthq/skills' && github.ref == 'refs/heads/main' && vars.NOTION_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Plan or publish
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$REQUESTED_MODE" = "plan" ]; then
            npm run notion:plan
          else
            npm run notion:publish -- --apply
          fi
