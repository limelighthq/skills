name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test the validator
        run: npm test
      - name: Validate the marketplace, plugins, and skills
        run: npm run validate
      - name: Check complete installations for four agents
        run: npm run test:install

  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install annotation and preview dependencies
        run: python -m pip install -r plugins/engineering/skills/annotate-ui-screenshots/requirements.txt -r plugins/company/skills/md-render/requirements-preview.txt
      - name: Install PDF dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0
          python -m pip install -r plugins/company/skills/md-render/requirements-pdf.txt
      - name: Test bundled scripts from temporary workspaces
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test screenshot annotation
        run: python -m unittest discover -s plugins/engineering/skills/annotate-ui-screenshots -p 'test_*.py' -v
