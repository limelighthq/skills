<!doctype html>
<html><head><meta charset="utf-8"><title>LogoStrip</title><style>.ll-logos{padding:40px 0}</style></head>
<body style="margin:0;background:var(--surface-150)">
<div id="root"></div>
<script>
  var L=window.Limelight,h=React.createElement;
  function ph(n){var s='<svg xmlns="http://www.w3.org/2000/svg" width="120" height="28" viewBox="0 0 120 28"><rect x="0.5" y="0.5" width="119" height="27" rx="4" fill="none" stroke="#bebebe" stroke-dasharray="3 3"/><text x="60" y="18" font-family="Arial" font-size="11" fill="#767676" text-anchor="middle">Customer logo '+n+'</text></svg>';return {src:'data:image/svg+xml,'+encodeURIComponent(s),alt:'Customer logo '+n};}
  ReactDOM.createRoot(document.getElementById('root')).render(h(L.LogoStrip,{logos:[ph(1),ph(2),ph(3),ph(4),ph(5),ph(6)],moving:false}));
</script>
</body></html>
