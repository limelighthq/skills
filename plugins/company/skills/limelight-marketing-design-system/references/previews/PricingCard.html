<!doctype html>
<html><head><meta charset="utf-8"><title>PricingCard</title></head>
<body style="margin:0;background:var(--surface-150)">
<div id="root" style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:24px 16px;align-items:start"></div>
<script>
  var L=window.Limelight,h=React.createElement;
  function lana(t){return h('div',{style:{display:'flex',flexDirection:'column',gap:12}},h('p',{className:'ll-strong'},'Supercharged by Lana'),h('p',{style:{margin:0,fontSize:14,lineHeight:1.5,color:'var(--text-500)',fontFamily:'var(--font-sans)'}},t));}
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,
    h(L.PricingCard,{agent:'ivy',ribbon:'What each agent does',name:'Ivy',role:'Influencer Manager',avatar:'images/Agent-portraits/ivy-portrait.png',summary:'Runs your entire creator program end-to-end.',features:['Sources and vets ICP-matched creators','Handles outreach, payments & deliverables','Tracks each partnership to closed revenue']},lana('Monitors creator activity, trending topics and competitor actions.')),
    h(L.PricingCard,{agent:'cooper',name:'Cooper',role:'Advocacy Manager',avatar:'images/Agent-portraits/cooper-portrait.png',summary:'Turns happy customers into a steady referral pipeline.',features:['Scores every customer for advocacy readiness','Tracks customer referrals to closed revenue']},lana('Tracks customer sentiment, public praise and company news.')),
    h(L.PricingCard,{name:'All agents',price:'$1499',per:'/month',action:h(L.Button,null,'Start free trial with all agents'),features:['Ivy manages your creator programme','Cooper grows pipeline through customer advocacy','Elliot turns your team’s audience into leads']})));
</script>
</body></html>
