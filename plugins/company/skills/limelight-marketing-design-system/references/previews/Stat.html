<html><head><meta charset="utf-8"><title>Stat</title></head>
<body style="margin:0;background:var(--surface-150)">
<div id="root" class="ll-stats" style="padding:16px"></div>
<script>
  var L=window.Limelight,h=React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,

</script>
</body></html>
