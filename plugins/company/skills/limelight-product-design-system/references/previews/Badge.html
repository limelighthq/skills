<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Badge</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:16px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
function Row(p){return h('div',{style:Object.assign({display:'flex',flexWrap:'wrap',gap:12,alignItems:'center',marginBottom:12},p.style)},p.children);}
function Cap(t){return h('div',{style:{fontSize:11,lineHeight:'16.5px',color:'var(--muted)',marginBottom:6}},t);}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',null,
 h(Row,null,h(L.Badge,{tone:'positive'},'Running'),h(L.Badge,null,'Draft'),h(L.Badge,{tone:'positive'},'NEW'),h(L.Badge,null,'Paid'),h(L.Badge,{tone:'warning'},'No numbers'),h(L.Badge,{tone:'warning'},'2 blocked')),
 h('div',{style:{width:232,display:'grid',gap:10}},h(L.Badge,{block:true},'Q2 is the backlog'),h(L.Badge,{block:true},'Customer story still a draft'))));
</script>
</body></html>
