<div id="root" class="lla" style="padding:20px 24px"></div>

var L=window.LimelightApp,h=React.createElement;
function cap(t){return h("p",{style:{margin:"0 0 8px",font:"500 12px/18px var(--font-inter)",color:"var(--seq-ink-2)"}},t);}
function Wait(p){var a=React.useState(p.a),u=React.useState(p.u),t=React.useState("9:00AM");
  return h(L.CadencePill,{amount:a[0],onAmountChange:function(e){a[1](e.target.value);},unit:u[0],onUnitChange:function(e){u[1](e.target.value);},time:t[0],onTimeChange:function(e){t[1](e.target.value);}});}

  h("div",{style:{height:20}}),
  cap("variant=\"mini\" · between steps in the StepRail"),
  h("div",{style:{width:243,background:"var(--seq-rail)"}},h(L.CadencePill,{variant:"mini"},"wait 2 business days"))
