<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DateInput</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:16px 24px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
function Demo(){
 var s=React.useState('2026-09-24'),v=s[0],set=s[1];var bad=!v||v>'2026-09-23';
 return h('div',{className:'lla-overlay',style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:28,alignItems:'start'}},
  h('div',{style:{display:'flex',flexDirection:'column',gap:14}},
   h(L.DateInput,{variant:'flow',label:'Payment date','aria-label':'External payment date',max:'2026-09-23',defaultValue:'2026-09-23'}),
   h(L.DateInput,{variant:'flow',label:'Payment date','aria-label':'External payment date',defaultValue:'2026-09-23',disabled:true,disabledReason:'Recorded payments keep their date.'})),
  h('div',{style:{display:'flex',flexDirection:'column',gap:14}},
   h(L.DateInput,{variant:'flow',label:'Payment date','aria-label':'External payment date',max:'2026-09-23',value:v,onChange:function(e){set(e.target.value);}}),
   h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
    h(L.Button,{block:true,disabled:bad,'aria-describedby':bad?'rec-why':null},'Record payment — no transfer'),
    bad?h('p',{id:'rec-why',style:{margin:0,fontSize:12,lineHeight:'18px',color:'var(--muted-overlay)'}},'Choose today or an earlier payment date to record it.'):null),
   h(L.DateInput,{variant:'plain',type:'datetime-local',label:'Next run','aria-label':'Ritual next run',defaultValue:'2026-09-21T09:00'})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script></body></html>
