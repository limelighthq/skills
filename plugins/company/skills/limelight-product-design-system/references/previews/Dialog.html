<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dialog</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:16px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
function Demo(){
  var s=React.useState('add'),open=s[0],set=s[1];
  return h('div',{style:{display:'flex',gap:8}},
    h(L.Button,{variant:'secondary',onClick:function(){set('add');}},'Add agent'),
    h(L.Button,{variant:'secondary',onClick:function(){set('full');}},'Open full view'),
    h(L.Dialog,{open:open==='add',onClose:function(){set(null);},title:'Add agent'},
      h('p',null,'This destination is visible in the reference, but its contents were not supplied. This prototype does not connect to Limelight.')),
    h(L.Dialog,{open:open==='full',onClose:function(){set(null);},title:'Your team · Conversations',size:'full'},
      h(L.Button,{variant:'secondary',block:true,onClick:function(){set(null);}},'Back to workspace')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script></body></html>
