<!-- @dsCard group="Overlays" height=760 width=1200 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Drawer</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:16px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
function Metric(v,l,first,small){
  return h('div',{style:{paddingLeft:first?0:22,borderLeft:first?0:'1px solid var(--drawer-line)'}},
    h('strong',{style:{display:'block',fontSize:23,lineHeight:'34.5px',fontWeight:600,letterSpacing:'-0.5px'}},v,small?h('small',{style:{fontSize:12,fontWeight:400,letterSpacing:0,color:'var(--drawer-meta)'}},small):null),
    h('span',{style:{display:'block',marginTop:3,fontSize:11,lineHeight:'16.5px',color:'var(--drawer-muted)'}},l));
}
function Section(t,tag){
  return h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',margin:'0 0 12px'}},
    h('h3',{style:{margin:0,fontSize:14,lineHeight:'21px',fontWeight:600,letterSpacing:'-0.2px'}},t),
    h('span',{style:{fontSize:10,lineHeight:'15px',color:'var(--drawer-meta)'}},tag));
}
function Demo(){
  var s=React.useState('review'),open=s[0],set=s[1];
  var r=React.useState(true),rej=r[0],setRej=r[1];
  var close=function(){set(null);};
  return h('div',{style:{display:'flex',gap:8}},
    h(L.Button,{variant:'secondary',onClick:function(){set('review');}},'Review Eli Garrison'),
    h(L.Button,{variant:'secondary',onClick:function(){set('booking');}},'Alex Rivera'),
    h(L.Drawer,{open:open==='review',onClose:close,eyebrow:'CREATOR REVIEW',initials:'EG',title:'Eli Garrison',subtitle:'VP Marketing · series-B SaaS',
      header:h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',padding:'15px 0 20px'}},Metric('28.9K','Followers',true),Metric('8.3%','Engagement'),Metric('94','Campaign fit',false,'/100')),
      notice:rej?h(L.Notice,{variant:'drawer',action:{label:'Undo',onClick:function(){setRej(false);}}},'Eli Garrison: marked not a fit.'):null,
      footer:[
        rej?[h('span',{key:'s',className:'lla-drawer-saved rejected'},'Rejected'),h(L.Button,{key:'u',variant:'secondary',onClick:function(){setRej(false);}},'Undo rejection')]
           :[h(L.Button,{key:'a',icon:'check'},'Select for outreach'),h(L.Button,{key:'b',variant:'secondary',onClick:function(){setRej(true);}},'Not a fit')],
        [h('span',{key:'w',id:'first-why',className:'lla-drawer-note'},'This is the first creator.'),
         h(L.Button,{key:'p',variant:'secondary',icon:'chevron-left','aria-label':'Previous creator',disabled:true,'aria-describedby':'first-why'}),
         h(L.Button,{key:'n',variant:'secondary',iconRight:'chevron-right','aria-label':'Next creator'},'Next')]]},
      Section('Past partnerships','Sample content'),
      h(L.EmptyState,{variant:'drawer',title:'No partnerships in this sample'},'Recent posts below can help you assess their voice and content style.'),
      h('div',{style:{height:24}}),
      Section('Recent content','Last 60 days'),
      h('p',{style:{margin:0,fontSize:11,lineHeight:'16.5px',color:'var(--drawer-note)'}},'Top posts by engagement · Typical post: 2,399 reactions')),
    h(L.Drawer,{open:open==='booking',onClose:close,title:'Alex Rivera',width:640,
      footer:h(L.Button,{},'Turn on')},
      h('p',null,'Q2 SaaS Growth · LinkedIn · Native post'),
      h('p',null,'No impressions back yet'),
      h('p',null,'Live 6 May. Ivy can ask for the numbers instead of you chasing them.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script></body></html>
