<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>KebabMenu</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:16px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
function Demo(){
  var s=React.useState(false),hidden=s[0],setHidden=s[1];
  var n=React.useState(''),note=n[0],setNote=n[1];
  return h('div',{style:{maxWidth:560}},
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
      h('strong',{style:{fontSize:13,lineHeight:'19.5px',fontWeight:600}},'Jordan Smith'),
      h(L.KebabMenu,{label:'Thread actions',defaultOpen:true,items:[
        {id:'hide',label:hidden?'Unhide thread':'Hide thread',icon:hidden?'eye':'eye-off',onSelect:function(){setHidden(!hidden);setNote(hidden?'Conversation restored to your inbox.':'Conversation hidden. Find it using the Hidden filter.');}},
        {separator:true},
        {id:'delete',label:'Delete thread',icon:'trash-2',danger:true,onSelect:function(){}}]})),
    note?h('p',{role:'status',style:{margin:'8px 0 0'}},note):null);
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script></body></html>
