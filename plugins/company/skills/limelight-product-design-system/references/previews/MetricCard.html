<!-- @dsCard group="Metrics" height=1495 width=900 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MetricCard</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:20px 25px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
function cap(t){return h("p",{style:{margin:"0 0 8px",font:"500 12px/18px var(--font-sans)",color:"var(--muted)"}},t);}
function row(cols,gap,kids){return h("div",{style:{display:"grid",gridTemplateColumns:"repeat("+cols+",minmax(0,1fr))",gap:gap}},kids);}
ReactDOM.createRoot(document.getElementById('root')).render(h("div",{style:{width:850}},
  cap("variant=\"wallet\" · Payments › Transactions › Your Wallet"),
  row(3,16,[
    h(L.MetricCard,{key:1,variant:"wallet",label:"Balance",value:"$12,400.00",unit:"USD",action:h(L.Button,null,"Add funds")}),
    h(L.MetricCard,{key:2,variant:"wallet",label:"Total Deposited",value:"$30,000.00",unit:"USD",note:"Lifetime deposits to your wallet"}),
    h(L.MetricCard,{key:3,variant:"wallet",label:"Total Spent",value:"$17,600.00",unit:"USD",note:"Lifetime payments to creators"})]),
  h("div",{style:{height:24}}),
  cap("variant=\"stat\" · Analytics › This month (the last card shows a down delta from This week)"),
  row(4,14,[
    h(L.MetricCard,{key:1,label:"Posts",value:"12",delta:"+2 vs last month",spark:{values:[8,9,7,10,9,11,10,12]}}),
    h(L.MetricCard,{key:2,label:"Impressions",value:"232K",delta:"+12% vs last month",spark:{values:[150,160,172,168,188,196,214,232]}}),
    h(L.MetricCard,{key:3,label:"Engagement rate",value:"4.8%",delta:"+0.4 pts",spark:{values:[3.9,4,4.2,4.1,4.4,4.5,4.6,4.8]}}),
    h(L.MetricCard,{key:4,label:"Posts",value:"4",delta:"−1 vs last week",deltaTone:"down",spark:{values:[2,3,2,4,3,3,4,4]}})]),
  h("div",{style:{height:24}}),
  cap("variant=\"stat\" size=\"lg\" · Campaign › Performance"),
  row(4,14,[
    h(L.MetricCard,{key:1,size:"lg",label:"Impressions",value:"143.3K",delta:"+18% vs. April",spark:{values:[62,71,68,84,92,101,118,143]}}),
    h(L.MetricCard,{key:2,size:"lg",label:"Engagements",value:"5,030",delta:"+11% vs. April",spark:{values:[21,26,24,31,33,38,44,50]}}),
    h(L.MetricCard,{key:3,size:"lg",label:"Engagement rate",value:"3.51%",delta:"−0.2pt vs. April",spark:{values:[38,37,36,36,35,35,35,35]}}),
    h(L.MetricCard,{key:4,size:"lg",label:"Cost per engagement",value:"$2.78",delta:"−9% vs. April",spark:{values:[24,23,22,21,20,19,19,18]}})]),
  h("div",{style:{height:24}}),
  cap("variant=\"chart\" · Analytics charts"),
  row(2,20,[
    h(L.MetricCard,{key:1,variant:"chart",title:"POSTING CADENCE",aside:"vs 3.8 usual",headline:"Posting 21% less than usual",headlineTone:"down",value:"3.0",caption:"posts / week · team avg",
      note:"Two quiet members are dragging the average — Jessica (8 days) and Ryan (4 days). Drafted nudges are ready in Approvals."},
      h(L.Gauge,{current:40,usual:62,label:"Current cadence 3.0. vs 3.8 usual",groups:[{label:"BELOW PACE",items:["Jessica 0.9","Ryan 1.2"]},{label:"KEEPING UP",items:["Sarah 2.8","David 2.1"]}]})),
    h(L.Funnel,{key:2,stages:[{value:"232K",label:"Impressions"},{value:"11.1K",label:"Engagements",ofPrevious:"4.8%"},{value:"1.9K",label:"Link clicks",ofPrevious:"17%"},{value:"14",label:"Demos booked",ofPrevious:"0.7%"}],note:"Attribution comes from Limelight link tracking, no network member data involved."}),
    h(L.MetricCard,{key:3,variant:"chart",title:"ENGAGEMENT OVER TIME",legend:[{label:"current"},{label:"previous",series:"prev"}],value:"11,140",caption:"engagements · +1,120 vs previous month",
      spark:{values:[6,14,19,21,29,33,38,44],previous:[9,13,17,22,25,29,33,38],label:"Current and previous engagement"}}),
    h(L.MetricCard,{key:4,variant:"chart",title:"POSTS VS. FOLLOWERS GAINED",legend:[{label:"posts"},{label:"followers",series:"s2"}],value:"+3,480",caption:"followers gained",
      spark:{values:[30,22,46,12,38,52,20,34],bars:[3,2,4,1,3,4,2,3],label:"Posts and followers gained"}})])
));
</script></body></html>
