<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Notice</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:16px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
function Demo(){
  return h('div',{style:{display:'flex',flexDirection:'column',gap:16,maxWidth:850}},
    h(L.Notice,{action:h(L.Button,{variant:'secondary'},'Undo')},'Creator review saved.'),
    h(L.Notice,{action:h(L.Button,{variant:'secondary'},'Dismiss')},'Approved. Reply to Maya Chen'),
    h(L.Notice,{variant:'inline',action:h(L.Button,{variant:'secondary'},'Undo delete')},'Thread deleted from Limelight only. Emails are unchanged.'),
    h('div',{style:{maxWidth:554}},h(L.Notice,{variant:'drawer',action:{label:'Undo'}},'Yuki Hayashi: marked not a fit.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script></body></html>
