<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NumberInput</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:16px 24px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gridTemplateColumns:'221px 221px 264px',gap:20,alignItems:'start'}},
 h('div',{className:'lla-overlay'},h(L.NumberInput,{variant:'targeting',label:'Budget ($)','aria-label':'Campaign budget',min:0,defaultValue:24000})),
 h('div',{className:'lla-overlay'},h(L.NumberInput,{variant:'targeting',label:'Relevancy floor (%)','aria-label':'Relevancy floor',min:0,max:100,defaultValue:80})),
 h(L.NumberInput,{variant:'portal',label:'Sponsored post rate',min:0.01,step:0.01,defaultValue:12.345,error:'Enter a positive post rate or bundled price, using at most two decimal places.'}),
 h('div',{className:'lla-overlay'},h(L.NumberInput,{label:'Spend cap',min:0,defaultValue:2500})),
 h('div',{className:'lla-overlay'},h(L.NumberInput,{variant:'targeting',label:'Relevancy floor (%)','aria-label':'Relevancy floor',min:0,max:100,defaultValue:80,disabled:true,disabledReason:'Discovery is running. Change the floor when it finishes.'}))));
</script></body></html>
