<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PageHeader</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:16px 0 16px 16px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
function Cap(p){return h('p',{style:{margin:'0 0 6px',fontSize:11,lineHeight:'16.5px',color:'var(--muted)'}},p.children);}
function Box(p){return h('div',{style:{width:p.w,marginBottom:16,borderLeft:'1px solid var(--line)',borderRight:'1px solid var(--line)'}},p.children);}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',null,
 h(Cap,null,'Main column at 1440 with the panel shown (898px)'),
 h(Box,{w:898},h(L.PageHeader,{title:'Campaigns',approvals:6})),
 h(Cap,null,'Panel hidden (main 1198px): the reopen pill follows Approvals'),
 h(Box,{w:1198},h(L.PageHeader,{title:'Campaigns',approvals:6,panelHidden:true,agent:'ivy'})),
 h(Cap,null,'Elliot member page: "David Walsh/Posts" renders with " · "'),
 h(Box,{w:1198},h(L.PageHeader,{title:'David Walsh/Posts',approvals:6,panelHidden:true,agent:'elliot'}))));
</script>
</body></html>
