<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PartyFilterTile</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:20px 24px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
function cap(t){return h("p",{style:{margin:"0 0 8px",font:"500 12px/18px var(--font-sans)",color:"var(--muted)"}},t);}
var parties=[{label:"The creator",count:4,reasons:["awaiting impressions","in revisions"]},{label:"Finance",count:2,reasons:["live and unpaid"]},{label:"Procurement",count:0,reasons:[]}];
function Row(){
  var s=React.useState("The creator"),on=s[0],set=s[1];
  return h(L.PartyFilterTile.Group,{label:"Waiting on"},parties.map(function(p){
    return h(L.PartyFilterTile,{key:p.label,label:p.label,count:p.count,reasons:p.reasons,disabled:!p.count,pressed:on===p.label,onClick:function(){set(on===p.label?"":p.label);}});
  }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h("div",{style:{width:800}},
  cap("Resting · Q2 SaaS Growth (Procurement holds nothing, so it is disabled and says why)"),
  h(L.PartyFilterTile.Group,{label:"Waiting on"},parties.map(function(p){return h(L.PartyFilterTile,{key:p.label,label:p.label,count:p.count,reasons:p.reasons,disabled:!p.count});})),
  h("div",{style:{height:24}}),
  cap("Filter on · \"The creator\" pressed (click a tile to toggle it)"),
  h(Row)
));
</script></body></html>
