<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PendingActionCard</title></head>
<body style="margin:0;background:var(--surface)">
<div id="root" class="lla" style="padding:24px"></div>
<script>
var L=window.LimelightApp,h=React.createElement;
function Demo(){
  var s=React.useState(["Collect campaign results","Prepare the weekly content plan"]),list=s[0],set=s[1];
  return h("div",{style:{display:"flex",flexDirection:"column",gap:16}},
    list.map(function(t){return h(L.PendingActionCard,{key:t,title:t,onCancel:function(){set(list.filter(function(x){return x!==t;}));}});}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script></body></html>
